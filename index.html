<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c1b"><title>Odyssey Pilipinas | Island Search</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header class="top"><div><span class="eyebrow">SURVIVOR ODYSSEY PILIPINAS</span><h1>The Island Search</h1><p>Select a coordinate to mark it searched. Contents remain hidden.</p></div><div class="stats" aria-live="polite"><strong id="count">0 / 30</strong><span>Squares searched</span></div></header><section class="board-shell" aria-label="Interactive island search board"><div class="board" id="board"><img src="assets/island-board.png" alt="Odyssey Pilipinas tropical island board with columns A through F and rows 1 through 5" draggable="false"><div id="cells" class="cells"></div></div></section><div class="controls"><div class="legend"><span class="marker-example">✕</span> Dug-up square <span class="muted">• Click a square again to remove its mark</span></div><div class="actions"><button id="undo" type="button">↶ Undo last search</button><button id="reset" type="button" class="danger">Reset board</button></div></div><p id="status" class="status" role="status" aria-live="polite"></p><footer>Host board • Mark searched only • Progress automatically saved on this device</footer></main><script src="script.js"></script></body></html>
